<html>
	<head>
		<title>HTML LISTS </title>
	</head>
	<body>
<!-- ORDERED LIST-->
###ORDERED LIST###
		<ol type="1" start="3" >
			<li>HTML</li>
			<li>CSS</li>
			<li>JSS</li>
		</ol>
<!--UNORDERED LIST-->
###UNORDERED LIST###
		
		<ul style="list-style-type:square;">
			<li>HTML</li>
			<li>CSS</li>
			<li>JSS</li>
		</ul>
<!--Description list-->
###Description list###
<dl>
	<dt>HTML</dt>
	<dd>Hyper Text Markup Language</dd>
	<dt>CSS</dt>
	<dd>Cascading Style Sheet</dd>
</dl>

<!--NESTED LIST-->
###NESTED LIST###
	<ul>
		<li>Frontend 
			<ol> 
				<li> HTML </li>
				<li> CSS </li>
				<li> JS </li>
			 </ol>
		</li>
		<li>Backend
			<ol> 
				<li>JAVA</li>  
			</ol>
		</li>
	</ul>


	</body>
</html>
